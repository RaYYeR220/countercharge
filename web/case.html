<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Case file — Countercharge</title>
<meta name="description" content="A worked case file: the real rendered bill, every disputable finding with its citation, and the dispute letter it supports." />
<link rel="stylesheet" href="css/main.css" />
</head>
<body>

<header class="top">
  <a class="mark" href="index.html"><span class="dot"></span>Countercharge</a>
  <nav class="top-links">
    <a href="index.html">Home</a>
    <a href="case.html" aria-current="page">Audit a case</a>
    <a href="trust.html">Trust center</a>
  </nav>
</header>

<nav class="case-tabs" id="case-tabs" aria-label="Choose a showcase case"></nav>

<main class="case-body" id="case-body">
  <div class="case-grid">
    <div>
      <div class="panel-box">
        <h3>Source document</h3>
        <figure class="bill-scan" id="bill-scan"></figure>
      </div>
      <div class="panel-box">
        <h3>Itemization, marked up</h3>
        <div class="carbon-form" id="carbon-form"></div>
      </div>
    </div>

    <div>
      <div class="panel-box">
        <h3>Findings</h3>
        <div id="findings-list"></div>
      </div>
      <div class="panel-box" id="advisory-box" hidden>
        <h3>Advisory (not disputable)</h3>
        <div id="advisory-list"></div>
      </div>
      <div class="panel-box">
        <h3>Totals</h3>
        <div class="totals-summary" id="totals-summary"></div>
      </div>
    </div>
  </div>

  <div class="panel-box" style="margin-top:22px;">
    <h3>Actions</h3>
    <div id="injection-box"></div>
    <div class="actions-grid">
      <div id="letter-box"></div>
      <div id="approval-box"></div>
    </div>
  </div>

  <div class="panel-box" style="margin-top:18px;">
    <h3>Agent run replay</h3>
    <div class="replay-console mono" id="replay-console">loading…</div>
    <p class="replay-note" id="replay-note"></p>
    <button class="cta ghost" id="replay-btn" style="margin-top:10px;">Replay</button>
  </div>
</main>

<footer class="site">
  Countercharge — a claims desk for patient advocates. <a href="trust.html">Trust center</a> for policy source and refdata versions.
</footer>

<script src="js/common.js"></script>
<script src="js/case.js"></script>
</body>
</html>
