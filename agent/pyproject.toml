[project]
name = "countercharge-agent"
version = "0.1.0"
description = "Case agent for Countercharge, packaged with the AgentCore Runtime contract"
requires-python = ">=3.12"
dependencies = [
    "countercharge-core",
    "countercharge-engine",
    "strands-agents[openai]==1.55.1",
    "strands-agents-tools>=0.2",
    "bedrock-agentcore>=1.9",
    "mcp>=1.24,<2",
    "boto3>=1.34",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pyjwt[crypto]>=2.9",
    "pypdfium2>=4.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "moto[dynamodb,s3]>=5.0",
]

[tool.uv.sources]
countercharge-core = { workspace = true }
countercharge-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/countercharge_agent"]
