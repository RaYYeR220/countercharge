[project]
name = "countercharge-core"
version = "0.1.0"
description = "Shared case store, signing, approvals and grounding for Countercharge"
requires-python = ">=3.12"
dependencies = [
    "countercharge-engine",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[dynamodb,ses]>=5.0",
]

[tool.uv.sources]
countercharge-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/countercharge_core"]
