[project]
name = "countercharge-policies"
version = "0.1.0"
description = "Cedar policy rendering for the Countercharge AgentCore Gateway"
requires-python = ">=3.11"
dependencies = [
    "cedarpy>=0.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/countercharge_policies"]
