[project]
name = "countercharge-engine"
version = "0.1.0"
description = "Deterministic medical-bill audit engine"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
]

[project.optional-dependencies]
build = [
    "httpx",
    "ijson",
    "openpyxl",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/countercharge_engine"]
