[project]
name = "countercharge-tools"
version = "0.1.0"
description = "AgentCore Gateway tool Lambdas for Countercharge"
requires-python = ">=3.12"
dependencies = [
    "countercharge-engine",
    "countercharge-core",
    "pydantic>=2.8",
    "boto3>=1.34",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "moto[dynamodb,ses,secretsmanager,scheduler]>=5.0",
]

[tool.uv.sources]
countercharge-engine = { workspace = true }
countercharge-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/countercharge_tools"]
